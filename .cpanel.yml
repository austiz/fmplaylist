---
# cPanel Git Version Control — post-deploy tasks
# Triggered by: cPanel → Git Version Control → Deploy HEAD Commit
#
# This is the fallback deploy path, for PHP-only changes when GitHub Actions is not
# available. It cannot build frontend assets (no Node.js on shared hosting) and does
# not touch public_html, so `public_html/build` keeps whatever the last Actions run
# put there. Deploying a frontend-touching commit this way ships a Vite manifest that
# does not match the built assets, which renders as a blank page -- see
# DEPLOY-NAMECHEAP.md, "The three deploy paths".
#
# `optimize:clear` runs first so a cached config from the previous deploy cannot
# survive into the new one, and `storage:link` runs because a fresh clone has no
# public/storage symlink. Both mirror .github/workflows/deploy.yml.
deployment:
  tasks:
    - export DEPLOYPATH=/home/$USER/fmplaylist
    - /bin/bash -c "cd $DEPLOYPATH && /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --quiet"
    - /bin/bash -c "cd $DEPLOYPATH && php artisan migrate --force"
    - /bin/bash -c "cd $DEPLOYPATH && php artisan optimize:clear"
    - /bin/bash -c "cd $DEPLOYPATH && php artisan config:cache"
    - /bin/bash -c "cd $DEPLOYPATH && php artisan route:cache"
    - /bin/bash -c "cd $DEPLOYPATH && php artisan view:cache"
    - /bin/bash -c "cd $DEPLOYPATH && php artisan event:cache"
    - /bin/bash -c "cd $DEPLOYPATH && php artisan storage:link || true"
