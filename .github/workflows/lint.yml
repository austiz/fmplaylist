name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # resources/js/{actions,routes} are gitignored and generated from the route
      # table. eslint's import resolver needs them on disk: without them the
      # `@/actions/*` and `@/routes/*` specifiers don't resolve, import/order puts
      # them in a different group, and the lint job fails on code that is fine.
      - name: Generate Wayfinder Definitions
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate

      # Check, never fix: the fixing variants (`composer lint`, `npm run format`)
      # rewrite files in place, so style drift passes CI silently.
      - name: Check PHP formatting
        run: composer lint:check

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint:check
