name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # resources/js/{actions,routes} are gitignored and generated from the route
      # table. eslint's import resolver needs them on disk: without them the
      # `@/actions/*` and `@/routes/*` specifiers don't resolve, import/order puts
      # them in a different group, and the lint job fails on code that is fine.
      # `--with-form` is required: the auth and settings pages use the `.form`
      # variants, and tsc fails on every one of them without it.
      - name: Generate Wayfinder Definitions
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      # Check, never fix: the fixing variants (`composer lint`, `npm run format`)
      # rewrite files in place, so style drift passes CI silently.
      - name: Check PHP formatting
        run: composer lint:check

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint:check
